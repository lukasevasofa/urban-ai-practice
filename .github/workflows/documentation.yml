name: Dashboard

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and generate HTML from saved results
        run: python scripts/check_project.py --dashboard-output "$RUNNER_TEMP/dashboard.html"
      - name: Save checked dashboard
        uses: actions/upload-artifact@v4
        with:
          name: korenovsk-dashboard
          path: ${{ runner.temp }}/dashboard.html
          if-no-files-found: error
          retention-days: 14

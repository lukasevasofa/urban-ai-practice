# This repository is a student research project, not an automatically published PyPI library.
name: Package validation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build package without installing research dependencies
        run: python -m build .
      - name: Validate package metadata
        run: python -m twine check dist/*
